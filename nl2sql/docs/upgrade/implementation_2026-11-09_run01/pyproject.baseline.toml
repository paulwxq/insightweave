[project]
name = "nl2sql-v3"
version = "0.1.0"
description = "NL2SQL v3 - Multi-agent SQL generation system with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangGraph核心
    "fastapi==0.143.0",
    "starlette==0.52.1",
    "langchain==1.4.5",
    "langgraph==1.2.15",
    "uvicorn==0.54.0",
    # 数据库驱动
    "psycopg[binary]==3.3.6",
    "cryptography==46.0.5",
    "pgvector>=0.2.0",
    "neo4j>=5.15.0",
    # SQL处理和验证
    "sqlparse>=0.4.4",
    "sqlglot==30.22.0",
    "pydantic==2.14.1",
    # LLM和嵌入
    "dashscope==1.27.5",
    "langchain-openai==1.7.1",
    "openai==3.29.0",
    # 工具
    "python-dotenv==1.2.4",
    "PyYAML>=6.0.0",
    "langchain-community==0.4.2",
    "psycopg-pool==3.3.3",
    "pymilvus>=2.6.5",
    "langgraph-checkpoint-postgres==3.1.3",
    "rich==15.0.0",
    # Deep Agents（db_deepagent 主框架，docs/v4/5 §2.1）
    "deepagents==0.7.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
monitoring = [
    # deepagents==0.7.25 要求 langsmith>=0.14.8（docs/v4/5 §2.1）
    "langsmith==0.14.8",
]
web = [
    "streamlit==1.65.0",
    "pandas==2.3.3",
    "requests==2.34.2",
]

[tool.uv]
constraint-dependencies = [
    # 本次升级的间接依赖，固定为已评估版本
    "langchain-core==1.6.10",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.3",
    "langgraph-checkpoint==4.3.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.7",
    "psycopg-binary==3.3.6",
    # 暂缓升级，保持原锁定版本
    "neo4j==6.1.0",
    "pgvector==0.4.2",
    "pymilvus==2.6.9",
    "sqlparse==0.5.5",
]
