# InsightWeave 前端 Nginx（doc 13 §4.1）：静态页面 + API 分流 + 控制路径拒绝
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 部署控制路径只允许容器内 exec 调用，Nginx 显式拒绝（§7.5）
    location /api/v2/_deploy/ { return 403; }
    location /api/_deploy/    { return 403; }

    # NL2SQL /api/v2 优先于通用 /api/；无 URI 的 proxy_pass 保留完整 URI
    location /api/v2/ {
        proxy_pass http://nl2sql:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # 覆盖前端 480s 查询超时（§4.1）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://metaweave:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
