# InsightWeave 本地发布（doc 13 §8.2）
name: InsightWeave local release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insightweave-local-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, insightweave-local]
    steps:
      # actions/checkout v5.0.0（2026-11-17 核验：08c6903 = "Prepare v5.0.0 release"）
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test, build and deploy locally
        shell: bash
        run: |
          release_id="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_manifest="$GITHUB_WORKSPACE/deploy/candidate-${release_id}.json"
          MANIFEST_OUT="$candidate_manifest" bash deploy/scripts/ci.sh "$release_id"
          CANDIDATE_MANIFEST="$candidate_manifest" bash deploy/scripts/deploy.sh release "$release_id"
